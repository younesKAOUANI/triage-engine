# Production stack for a shared host: the app and its datastores, with no
# published ports at all.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# TLS is not here. The box runs two other projects and there is one pair of
# 80/443 between them, so a shared edge Caddy terminates for every name and
# reaches this app by container name over the external `edge` network. That
# Caddy lives in the portfolio repository, under deploy/edge.
#
# Differs from docker-compose.yml (the local dev stack) in ways that matter:
#   - the app image is pulled from the registry, not built on the box
#   - nothing publishes a port to the host
#   - logs are size-capped so a busy week cannot fill the disk

# Pinned rather than derived from the directory name. Container and volume names
# are what `--remove-orphans` and every rollback command key on, and a clone into
# a differently-named directory would otherwise quietly start a second, empty
# stack alongside the real one.
name: triage-engine

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  app:
    image: ${APP_IMAGE:?set APP_IMAGE, e.g. ghcr.io/owner/triage-engine:sha}
    restart: unless-stopped
    env_file: [.env]
    environment:
      # Reach the sibling containers over the data network, on their
      # in-container ports.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # The edge Caddy is the only thing that talks to the app, so honour its
      # forwarded client address. Safe only because Caddy sets X-Forwarded-For
      # from the real peer and discards any the caller supplied; meaningless and
      # spoofable the moment this container is reachable without a proxy.
      TRUST_PROXY: "true"
      # The bundled sink stands in for a real consumer. Point WEBHOOK_TARGET_URL
      # at the actual downstream when there is one.
      WEBHOOK_TARGET_URL: ${WEBHOOK_TARGET_URL:-http://app:3000/_sink/webhook}
    # Docker SIGKILLs 10s after SIGTERM by default, which severs enrichment
    # mid-flight on every deploy. The engine recovers — that is what the DLQ and
    # the reconciliation sweep are for — but leaning on recovery for a routine
    # restart is not the same as shutting down cleanly.
    stop_grace_period: 60s
    init: true # reap zombies and forward SIGTERM so shutdown hooks run
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # On both networks on purpose: `edge` carries the proxied traffic in AND the
    # app's outbound calls to the Mistral API. `data` is egress-less and only
    # exists so Postgres and Redis have no route off the box.
    networks:
      edge:
        # Compose would otherwise only alias this container as `app` on a
        # network three projects share. The edge Caddyfile routes to this name.
        aliases:
          - triage-app
      data: {}
    logging: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly so queue state survives a restart. BullMQ keeps jobs in Redis;
    # losing it mid-flight strands tickets, which is what the reconciliation
    # sweep exists to recover from — but not needing it is better.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]
    logging: *logging

networks:
  # Shared with the portfolio and Aliquot, and created out of band rather than
  # owned here — see the deploy/edge directory of the portfolio repository. No
  # stack should be a startup dependency of the other two.
  edge:
    name: edge
    external: true
  data:
    internal: true # Postgres and Redis get no route off the host

volumes:
  pgdata:
  redisdata:
